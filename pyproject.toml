[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "europress-smart-material-value-engine"
version = "1.0.1"
description = "Synthetic industrial dataset generator for the Europress x Since AI Hackathon 2026 (SMART Material Value Engine). All data synthetic."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "duckdb>=1.0", "pyyaml>=6", "pytz", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.4", "markdown>=3.4"]
app = ["streamlit>=1.40"]  # demo app: streamlit run app/app.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
