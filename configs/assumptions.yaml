organisations:
  # heavy-tailed fleet sizes: share of orgs by number of sites
  sites_per_org: {1: 0.46, 2: 0.18, 3: 0.12, 5: 0.10, 8: 0.07, 12: 0.05, 20: 0.02}
  single_sector_prob: 0.85

policies:
  # share of devices by collection policy
  # Europress review 30.10.2026: in practice most devices are emptied ON_CALL (fill-triggered); only a small
  # share runs on a fixed schedule.
  mix: {ON_CALL: 0.78, FIXED_SCHEDULE: 0.12, HYBRID: 0.10}
  sizing_error_sigma: 0.32          # customer's misestimate of required frequency (lognormal)
  on_call_threshold_pct: [60, 85]
  hybrid_skip_below_pct: [30, 45]
  lead_business_days_mean: 0.6
  adhoc_after_full_hours: [6, 30]   # customer calls an extra collection once full this long

operations:
  operator_hours: [6, 18]
  delay_mix:            # [probability, min_h, max_h]
    on_time: [0.66, -2, 2]
    late_hours: [0.22, 2, 8]
    next_day: [0.08, 16, 30]
    multi_day: [0.025, 40, 80]
  missed_prob: 0.012
  wasted_trip_prob: 0.007
  random_cancel_prob: 0.015
  partial_prob_default: 0.006
  partial_prob_biowaste_winter: 0.05
  partial_residual: [0.10, 0.40]
  combined_load_prob: 0.05
  stored_tare_prob: 0.45
  weighbridge_resolution_kg: 20
  weighbridge_sigma_kg: 12

telemetry:
  mass_resolution_kg: 5
  # Simulated integrated weighing, NORMAL state: reading noise sigma = max(15 kg, 1.4 % of container mass) plus a
  # small installation calibration error (gain sd 0.4 %, offset sd 6 kg): about 1.5 % total. This meets the
  # challenge target "at most ~100 kg error on a 3 t cardboard load" for about 95 % of normal-state readings.
  # It is a SIMULATION TARGET for this challenge, NOT a specification of any Europress weighing solution.
  # Injected fault scenarios (drift, calibration error, fault states) deliberately exceed it.
  mass_sigma_abs_kg: 15
  mass_sigma_rel: 0.014
  fill_sigma_pp: 3.5
  fill_bias_sd_pp: 4.0
  fill_gain_sd: 0.07
  outage_rate_per_30d: 1.6
  outage_median_h: 5
  outage_sigma: 1.3
  buffered_delivery_prob: 0.75
  isolated_drop_prob: 0.006
  duplicate_prob: 0.003
  latency_median_s: 40
  spike_prob: 0.0015

contracts:
  # Customer-operator tariffs (HYPOTHETICAL). Europress is currently not a party to waste transport or treatment.
  # Tariffs, processing fees and material credits are agreed between the customer and the waste operator.
  # All prices in this dataset are hypothetical. In the data they appear as information the customer has
  # handed to the service (contracts, invoices) or that the operator shares (weighbridge, quality).
  pricing_model_mix: {FIXED_PER_LIFT: 0.30, PER_TONNE: 0.15, HYBRID: 0.35, HYBRID_MIN: 0.20}
  lift_fee_eur: [65, 140]
  per_km_eur: [1.2, 2.4]
  free_km: [0, 30]
  fuel_surcharge_bp: [0, 900]
  rental_eur_month: [0, 180]
  min_charge_eur: [140, 260]
  credit_share_bp: [6000, 9000]
  contamination_penalty_eur: [40, 120]
  cancellation_fee_eur: [30, 70]
  wasted_trip_fee_eur: [60, 120]
  side_waste_fee_eur: [45, 110]
  emergency_surcharge_eur: [60, 150]
  annual_escalation_pct: [1.5, 5.5]
  midyear_amendment_prob: 0.18
  benchmark_eur_per_t_multiplier: [0.9, 1.25]

operator_actions:
  # Task C2 valuation rules (operator and contract actions). HYPOTHETICAL, published so that teams can reason
  # about them; teams may argue for other values in their business case. Values are in EUR, per contract.
  # Europress is currently not a party to waste transport or treatment; all prices are hypothetical.
  valuation_horizon_months: 12          # forward value of contract-level actions
  dispute_lookback_days: 90             # invoices issued in the last 90 days before the case date can be disputed
  dispute_recovery_rate: 0.9            # share of documented overbilling recovered by a credit note
  dispute_admin_cost_eur: 60            # customer effort per dispute
  request_weighbridge_comply_prob: 0.6  # chance the operator starts sharing weighbridge tickets on request
  request_admin_cost_eur: 20
  renegotiation_success_prob: 0.5       # chance the operator accepts peer-median terms ...
  renegotiation_min_gap_pct: 10         # ... which it considers only if the contract costs >= 10 % more than peer terms
  renegotiation_effort_eur: 150
  tender_success_prob: 0.8              # chance a tender produces a contract at the alternative's typical terms
  tender_min_gap_pct: 10                # the alternative must be at least 10 % cheaper, otherwise you stay
  tender_switch_cost_eur: 500           # tendering + switching effort; benefit starts after the notice period
