# ---------------------------------------------------------------------------
# Europress SMART Material Value Engine — synthetic world assumptions
# ALL VALUES ARE ILLUSTRATIVE, ORDER-OF-MAGNITUDE ASSUMPTIONS CHOSEN BY SINCE AI.
# They are NOT Europress product specifications, NOT measured customer data and
# NOT market prices. They are configurable so teams can run sensitivity analyses.
#
# Europress is currently not a party to waste transport or treatment. Tariffs, processing fees and
# material credits are agreed between the customer and the waste operator. All prices in this dataset
# are hypothetical.
#
# Equipment classes COMBI (compactor and container permanently joined, emptied as one unit) and DUO
# (stationary compactor, detachable container is emptied) are Europress machine-type categories. No
# model-specific technical data is represented.
# Maximum container size per class (Europress, 4 Nov 2026): COMBI 22 m3, DUO 30 m3. A unit whose container
# exceeds the COMBI limit is a DUO unit (blocking validator check MAT:equipment_volume_limit).
# Money: EUR excl. VAT. Mass: kg. Volume: m3. Distance: km (billable round trip).
# ---------------------------------------------------------------------------
assumptions_version: "1.0.0"
timezone: "Europe/Helsinki"
equipment_max_volume_m3: {COMBI: 22, DUO: 30}

regions:
  # code: [name, weight, median_billable_km, km_sigma, remote_surcharge_eur_per_lift]
  FI-02: {name: "Varsinais-Suomi", weight: 0.26, median_km: 22, km_sigma: 0.45, remote_surcharge: 0}
  FI-01: {name: "Uusimaa", weight: 0.30, median_km: 26, km_sigma: 0.40, remote_surcharge: 0}
  FI-11: {name: "Pirkanmaa", weight: 0.16, median_km: 24, km_sigma: 0.45, remote_surcharge: 0}
  FI-08: {name: "Keski-Suomi", weight: 0.10, median_km: 38, km_sigma: 0.50, remote_surcharge: 0}
  FI-17: {name: "Pohjois-Pohjanmaa", weight: 0.12, median_km: 42, km_sigma: 0.55, remote_surcharge: 15}
  FI-19: {name: "Lappi", weight: 0.06, median_km: 85, km_sigma: 0.50, remote_surcharge: 35}

operators:
  # Fictional haulers / treatment operators. Data-sharing behaviour models the
  # real-world problem that operator weighbridge data is not always accessible.
  # on_time_factor scales the on-time share of the delay mix; missed_factor scales the missed-visit probability.
  # Quality differences between the fictional operators are synthetic and needed for the scorecard task.
  OP-A: {name: "Hauler Alpha (fictional)", regions: [FI-02, FI-01, FI-11], weighbridge_share_prob: 0.97, share_lag_days: [0.5, 3], invoice_error_rate: 0.010, api_feed: true, on_time_factor: 1.2, missed_factor: 0.6}
  OP-B: {name: "Hauler Beta (fictional)", regions: [FI-01, FI-08, FI-11], weighbridge_share_prob: 0.88, share_lag_days: [2, 12], invoice_error_rate: 0.020, api_feed: false, on_time_factor: 0.95, missed_factor: 1.0}
  OP-C: {name: "Hauler Gamma (fictional)", regions: [FI-17, FI-19, FI-08], weighbridge_share_prob: 0.55, share_lag_days: [10, 45], invoice_error_rate: 0.035, api_feed: false, on_time_factor: 0.8, missed_factor: 1.8}
  OP-D: {name: "Hauler Delta (fictional)", regions: [FI-02, FI-11], weighbridge_share_prob: 0.0, share_lag_days: [0, 0], invoice_error_rate: 0.025, api_feed: false, on_time_factor: 1.0, missed_factor: 1.4}
  OP-E: {name: "Hauler Epsilon (fictional)", regions: [FI-01, FI-02, FI-17, FI-19], weighbridge_share_prob: 0.95, share_lag_days: [0.02, 0.5], invoice_error_rate: 0.012, api_feed: true, on_time_factor: 1.1, missed_factor: 0.8}

materials:
  # compacted_density: container density after compaction (kg/m3), mean and device-level CV
  # compressibility: extra densification as the container fills (dimensionless)
  # input_event_kg: median mass of one loading/compaction cycle
  # max_days_between: hygiene / fire-safety / contractual maximum collection interval
  # index: illustrative reference price (EUR/t) start value; credit basis (credit-eligible streams only)
  # credit_eligible: only cardboard and plastics can earn a material credit; all other streams (incl. paper)
  #   are chargeable to the customer (processing fee per tonne).
  cardboard:     {credit_eligible: true,  compacted_density: 190, density_cv: 0.15, daily_density_cv: 0.07, compressibility: 0.25, moisture_sensitive: true,  base_moisture_pct: 8,  contamination_alpha: 1.6, contamination_beta: 45, input_event_kg: 18, max_days_between: 28, index_start: 95,  index_monthly_vol: 0.06, processing_fee: [0, 0],    equipment: [DUO, COMBI], volumes: [10, 12, 16, 20, 24, 30]}
  paper:         {credit_eligible: false, compacted_density: 330, density_cv: 0.12, daily_density_cv: 0.05, compressibility: 0.15, moisture_sensitive: true,  base_moisture_pct: 6,  contamination_alpha: 1.2, contamination_beta: 55, input_event_kg: 22, max_days_between: 28, index_start: 0,   index_monthly_vol: 0.0,  processing_fee: [20, 45],  equipment: [DUO, COMBI], volumes: [6, 8, 10, 12, 16, 20]}
  plastic_film:  {credit_eligible: true,  compacted_density: 140, density_cv: 0.18, daily_density_cv: 0.09, compressibility: 0.35, moisture_sensitive: false, base_moisture_pct: 2,  contamination_alpha: 2.0, contamination_beta: 28, input_event_kg: 9,  max_days_between: 28, index_start: 120, index_monthly_vol: 0.10, processing_fee: [0, 0],    equipment: [DUO, COMBI], volumes: [10, 12, 16, 20, 24]}
  mixed_plastic: {credit_eligible: true,  compacted_density: 115, density_cv: 0.18, daily_density_cv: 0.10, compressibility: 0.30, moisture_sensitive: false, base_moisture_pct: 3,  contamination_alpha: 2.5, contamination_beta: 20, input_event_kg: 8,  max_days_between: 28, index_start: 12,  index_monthly_vol: 0.25, processing_fee: [25, 45],  equipment: [DUO], volumes: [10, 16, 20]}
  mixed_waste:   {credit_eligible: false, compacted_density: 380, density_cv: 0.15, daily_density_cv: 0.08, compressibility: 0.20, moisture_sensitive: false, base_moisture_pct: 20, contamination_alpha: 0,   contamination_beta: 0,  input_event_kg: 25, max_days_between: 21, index_start: 0,   index_monthly_vol: 0.0,  processing_fee: [105, 135], equipment: [DUO, COMBI], volumes: [8, 10, 12, 16, 20, 24, 30]}
  biowaste:      {credit_eligible: false, compacted_density: 620, density_cv: 0.10, daily_density_cv: 0.06, compressibility: 0.08, moisture_sensitive: false, base_moisture_pct: 70, contamination_alpha: 0,   contamination_beta: 0,  input_event_kg: 30, max_days_between: 7,  index_start: 0,   index_monthly_vol: 0.0,  processing_fee: [62, 88],  equipment: [COMBI], volumes: [3, 4, 6, 8, 10]}

quality_grades:
  # Quality is determined ONLY by the waste operator at its processing facility, using its own assessment.
  # Europress has no technology to determine material quality before the facility; devices do not measure it.
  # contamination share thresholds (operator assessment) -> credit quality factor (basis points)
  A: {max_contamination: 0.04, quality_bp: 10000}
  B: {max_contamination: 0.09, quality_bp: 8500}
  C: {max_contamination: 0.18, quality_bp: 6000}
  R: {max_contamination: 1.00, quality_bp: 0}       # rejected -> reprocessed as mixed waste

